name: CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_USER: bergama
          POSTGRES_PASSWORD: bergama
          POSTGRES_DB: bergama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bergama -d bergama_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BERGAMA_DATABASE__URL: postgresql+psycopg://bergama:bergama@localhost:5432/bergama_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --frozen --group dev

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Validate secrets
        run: make validate-secrets

      - name: Test API
        run: make test-api

  frontend-quality-gate:
    name: frontend-quality-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform-console
    env:
      NEXT_PUBLIC_BERGAMA_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/platform-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e
